name: Tự Động Săn Link Bóng Đá Hằng Ngày

on:
  schedule:
    # Berjalan otomatis setiap 5 menit
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Kéo mã nguồn về máy chủ
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0

    - name: Cài đặt Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cài đặt thư viện Python & Chromium
      run: |
        python -m pip install --upgrade pip
        pip install playwright requests Pillow firebase-admin
        playwright install --with-deps chromium

    - name: 🚀 Run Scraper & Push Firebase
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
      run: private_vip_1/samping.py

    - name: 🖼️ Push Banner Logos ke GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        # Hanya memasukkan folder logos/ ke dalam commit git
        git add logos/
        # Commit dan push hanya jika ada logo baru yang dibuat
        git diff --staged --quiet || (git commit -m "Auto-update match banners [skip ci]" && git pull --rebase origin main && git push origin main)
